name: Publish signed FoldSpace update
on:
  push:
    branches: [main]
    paths: ['latest/**', '.github/workflows/publish.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Publish verified update
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ ! -f latest/version.txt ]; then exit 0; fi
          VERSION="$(cat latest/version.txt)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          cd latest
          sha256sum --check FoldSpace-release.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs FoldSpace-release.apk | tee "$RUNNER_TEMP/certificate.txt"
          grep -Fiq 'Signer #1 certificate SHA-256 digest: 69da84826f2785c766783bf58ad1c9761d98264cb6e8970fed8324ca99840dd1' "$RUNNER_TEMP/certificate.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging FoldSpace-release.apk | grep -F "versionName='$VERSION'"
          TAG="v$VERSION"
          # Rerunning must not overwrite a published APK or create an empty release.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern FoldSpace-release.apk --dir "$RUNNER_TEMP/published"
            cmp FoldSpace-release.apk "$RUNNER_TEMP/published/FoldSpace-release.apk"
            exit 0
          fi
          gh release create "$TAG" FoldSpace-release.apk FoldSpace-release.apk.sha256 \
            --title "FoldSpace $VERSION" --latest \
            --notes 'Permanently signed FoldSpace preview. Use FoldSpace menu > Update to download. Android requires installation approval. Switching from an old debug APK may require a one-time uninstall that removes FoldSpace settings.'
