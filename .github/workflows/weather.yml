name: Publish signed Fold Weather
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['weather/latest/**', '.github/workflows/weather.yml']
permissions:
  contents: write
concurrency:
  group: public-weather-release
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify and publish weather APK
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f weather/latest/version.txt ]; then exit 0; fi
          VERSION="$(cat weather/latest/version.txt)"
          CODE="$(cat weather/latest/code.txt)"
          [[ "$VERSION" =~ ^1\.0\.[0-9]+$ ]]
          [[ "$CODE" =~ ^[0-9]+$ ]]
          cd weather/latest
          sha256sum --check FoldWeather-release.apk.sha256
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs FoldWeather-release.apk | tee "$RUNNER_TEMP/cert.txt"
          grep -Fiq 'Signer #1 certificate SHA-256 digest: 69da84826f2785c766783bf58ad1c9761d98264cb6e8970fed8324ca99840dd1' "$RUNNER_TEMP/cert.txt"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging FoldWeather-release.apk > "$RUNNER_TEMP/package.txt"
          grep -F "name='com.foldspace.weather' versionCode='$CODE' versionName='$VERSION'" "$RUNNER_TEMP/package.txt"
          TAG="weather-v$VERSION"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --pattern FoldWeather-release.apk --dir "$RUNNER_TEMP/published"
            cmp FoldWeather-release.apk "$RUNNER_TEMP/published/FoldWeather-release.apk"
          else
            gh release create "$TAG" FoldWeather-release.apk FoldWeather-release.apk.sha256 --latest=false --title "Fold Weather $VERSION" --notes 'Standalone Fold Weather with live forecasts, a configurable 24-hour temperature widget, location search, offline cache and permanently signed updates. Choose your location in the app, then add Fold Weather through your launcher widget picker. Android requires installation approval. Weather: Open-Meteo; locations: GeoNames.'
          fi
          cd ../..
          printf '{"version":"%s","versionCode":%s,"url":"https://github.com/Schildhorn12/Foldspace-Updates/releases/download/%s/FoldWeather-release.apk"}\n' "$VERSION" "$CODE" "$TAG" > weather/latest.json
          git config user.name 'Fold Weather Release'
          git config user.email 'fold-weather@users.noreply.github.com'
          git add weather/latest.json
          if ! git diff --cached --quiet; then git commit -m "Update weather feed to $VERSION"; git pull --rebase origin main; git push origin HEAD:main; fi
